id = "http-request-client"
name = "HTTP Request Client"
version = "0.1.0"
schema_version = 1
authors = ["Einstein Adriano <einstein@feap.io>"]
description = "Destaque de sintaxe e execução de requisições para arquivos .http e .rest"
repository = "https://github.com/einstein-adriano/zed-http-request-client"

# Fork de https://github.com/rest-nvim/tree-sitter-http com o patch de
# comentários em query params multilinha (ver grammars-src/README.md).
# `repository` aceita qualquer remote git, inclusive um caminho local — o que
# permite iterar no grammar sem publicar. Ao publicar a extensão, troque por
# uma URL pública do fork (o rev é o mesmo).
[grammars.http]
repository = "/home/einstein/projects/studies/Rust/zed-api-client/grammars-src/tree-sitter-http"
rev = "66e8d6559e2f2386b43574b1c565ebcdc213b4fe"

[language_servers.http-request-client]
name = "HTTP Request Client"
languages = ["HTTP"]
